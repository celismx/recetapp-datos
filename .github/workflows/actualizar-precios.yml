name: Actualizar precios

on:
  schedule:
    - cron: "17 11 * * *"   # todos los días, 6:17 a. m. hora de Colombia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Correr scraper
        run: python scraper/scrape.py
      - name: Guardar cambios
        run: |
          git config user.name "recetapp-bot"
          git config user.email "recetapp-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Precios del $(date +%F)"
          git push
